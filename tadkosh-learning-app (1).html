
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دردشة المستقبل</title>

<style>
body {
  background: #101827;
  color: white;
  font-family: Arial;
  text-align: center;
}

.chat {
  background: #1e293b;
  padding: 20px;
  margin: 30px auto;
  max-width: 400px;
  border-radius: 15px;
}

input {
  padding: 12px;
  width: 65%;
  border-radius: 8px;
  border: none;
}

button {
  padding: 12px;
  background: #06b6d4;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#messages {
  text-align: right;
  margin-top: 20px;
}

.message {
  background: #334155;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="chat">
  <h2>💬 دردشة المستقبل</h2>

  <input id="message"
  placeholder="اكتب رسالتك">

  <button onclick="sendMessage()">
    إرسال
  </button>

  <div id="messages"></div>
</div>

<script>
function sendMessage() {

  let input = document.getElementById("message");

  let text = input.value.trim();

  if (text === "") return;

  let message = document.createElement("div");

  message.className = "message";

  message.textContent = text;

  document.getElementById("messages")
  .appendChild(message);

  input.value = "";
}
</script>

</body>
</html>
